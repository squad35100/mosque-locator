<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Mosque Radar</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; max-width: 500px; margin: 0 auto; }
        h2 { text-align: center; color: #333; }
        .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-left: 5px solid #27ae60; }
        .btn { display: block; width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-secondary { background: #2980b9; }
        .hidden { display: none !important; }
        #status { text-align: center; font-weight: bold; color: #2980b9; margin-bottom: 15px; }
        input[type="text"] { width: 100%; padding: 15px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        .flex-buttons { display: flex; gap: 10px; }
    </style>
</head>
<body>

    <h2>Community Mosque Radar</h2>
    
    <div class="flex-buttons">
        <button id="radarBtn" class="btn">📡 Live Radar</button>
        <button id="addBtn" class="btn btn-secondary">➕ Add Mosque</button>
    </div>

    <p id="status"></p>
    
    <!-- Radar View -->
    <div id="mosqueList"></div>

    <!-- Add Mosque Form View -->
    <div id="addForm" class="card hidden">
        <h3>Register New Mosque</h3>
        <p>Your phone's GPS is locked. Enter the mosque name to save it to the database.</p>
        <input type="text" id="mosqueNameInput" placeholder="e.g. Masjid-e-Osman">
        <button id="submitMosqueBtn" class="btn">Save to Database</button>
    </div>

    <script>
        // ==========================================
        // PASTE YOUR GOOGLE APPS SCRIPT URL HERE
        // ==========================================
        const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbzUGSb2t_x9SJbO--CvZ8dZ-F6QyPJlE4xCb2TN140lbDgulDTlaLlCjsriWGHR0PZqAg/exec"; 
        
        let mosquesData = []; 
        let watchId = null;
        let tempLat = 0;
        let tempLon = 0;

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
        }

        // On Load: Fetch the database so we have it for the duplicate check
        fetch(SHEET_API_URL + "?action=read")
            .then(res => res.json())
            .then(data => mosquesData = data)
            .catch(err => console.log("Database empty or not connected yet."));

        // ==========================================
        // MODE 1: LIVE RADAR
        // ==========================================
        document.getElementById('radarBtn').addEventListener('click', () => {
            document.getElementById('addForm').classList.add('hidden');
            const statusText = document.getElementById('status');
            statusText.innerText = "Downloading Mosque Database...";

            fetch(SHEET_API_URL + "?action=read")
                .then(response => response.json())
                .then(data => {
                    mosquesData = data;
                    statusText.innerText = `Database loaded: ${mosquesData.length} mosques. Starting Radar...`;
                    
                    if(watchId) navigator.geolocation.clearWatch(watchId);
                    
                    watchId = navigator.geolocation.watchPosition(position => {
                        const currentLat = position.coords.latitude;
                        const currentLon = position.coords.longitude;
                        statusText.innerText = "Live Radar Active 🟢";

                        let sorted = mosquesData.map(m => {
                            m.distance = calculateDistance(currentLat, currentLon, m.lat, m.lon);
                            return m;
                        }).sort((a, b) => a.distance - b.distance);

                        const container = document.getElementById('mosqueList');
                        container.innerHTML = ""; 
                        
                        sorted.slice(0, 5).forEach(m => {
                            let dist = (m.distance * 1000).toFixed(0) + " meters";
                            if(m.distance >= 1) dist = m.distance.toFixed(2) + " km"; 
                            container.innerHTML += `<div class="card"><h3>${m.name}</h3><span style="color:#e74c3c; font-weight:bold;">📍 ${dist} away</span></div>`;
                        });
                    }, err => console.log(err), { enableHighAccuracy: true });
                });
        });

        // ==========================================
        // MODE 2: ADD A MOSQUE (CROWDSOURCE)
        // ==========================================
        document.getElementById('addBtn').addEventListener('click', () => {
            if(watchId) navigator.geolocation.clearWatch(watchId);
            document.getElementById('mosqueList').innerHTML = "";
            const statusText = document.getElementById('status');
            statusText.innerText = "Locking GPS to check for duplicates...";

            navigator.geolocation.getCurrentPosition(position => {
                tempLat = position.coords.latitude;
                tempLon = position.coords.longitude;

                // DUPLICATE CHECK: Are we within 50 meters (0.05 km) of an existing mosque?
                let isDuplicate = false;
                mosquesData.forEach(m => {
                    if(calculateDistance(tempLat, tempLon, m.lat, m.lon) < 0.05) {
                        isDuplicate = true;
                    }
                });

                if(isDuplicate) {
                    statusText.innerHTML = "<span style='color:red;'>A mosque is already registered at this exact location!</span>";
                } else {
                    statusText.innerText = "Location locked. Ready to add.";
                    document.getElementById('addForm').classList.remove('hidden');
                }
            }, err => {
                statusText.innerText = "Please turn on GPS to add a mosque.";
            }, { enableHighAccuracy: true });
        });

        // ==========================================
        // SUBMIT TO GOOGLE SHEETS
        // ==========================================
        document.getElementById('submitMosqueBtn').addEventListener('click', () => {
            const name = document.getElementById('mosqueNameInput').value;
            if(!name) return alert("Please type a name.");
            
            document.getElementById('status').innerText = "Saving to database...";
            document.getElementById('submitMosqueBtn').disabled = true;

            const url = `${SHEET_API_URL}?action=add&name=${encodeURIComponent(name)}&lat=${tempLat}&lon=${tempLon}`;
            
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('status').innerText = "✅ Mosque Added Successfully!";
                    document.getElementById('addForm').classList.add('hidden');
                    document.getElementById('mosqueNameInput').value = "";
                    document.getElementById('submitMosqueBtn').disabled = false;
                    
                    // Instantly fetch the updated database into the phone's memory
                    fetch(SHEET_API_URL + "?action=read")
                        .then(r => r.json())
                        .then(d => mosquesData = d);
                });
        });
    </script>
</body>
</html>
