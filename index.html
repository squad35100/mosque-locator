<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearest Mosques</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; max-width: 500px; margin: 0 auto; }
        h2 { text-align: center; color: #333; }
        .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card h3 { margin: 0 0 10px 0; color: #2c3e50; }
        .times { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 14px; }
        .distance { color: #27ae60; font-weight: bold; margin-bottom: 10px; display: inline-block; }
        .btn { display: block; width: 100%; padding: 12px; background: #2980b9; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-bottom: 15px; }
        .btn:active { background: #2471a3; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h2>Nearby Jamaat Times</h2>
    <button id="findBtn" class="btn">Find Nearest Mosques</button>
    <p id="status"></p>
    
    <div id="mosqueList"></div>
    <button id="loadMoreBtn" class="btn hidden">Load More (5)</button>

    <script>
        let nearbyMosques = [];
        let currentlyDisplayed = 0;
        const BATCH_SIZE = 5;
        const MAX_DISTANCE_KM = 1.0; 

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        document.getElementById('findBtn').addEventListener('click', () => {
            const statusText = document.getElementById('status');
            statusText.innerText = "Locating...";
            
            if (!navigator.geolocation) {
                statusText.innerText = "Geolocation is not supported by your browser.";
                return;
            }

            navigator.geolocation.getCurrentPosition(position => {
                const userLat = position.coords.latitude;
                const userLon = position.coords.longitude;
                statusText.innerText = "Location found. Searching mosques...";

                fetch('mosques.json')
                    .then(response => response.json())
                    .then(data => {
                        nearbyMosques = data.map(mosque => {
                            mosque.distance = calculateDistance(userLat, userLon, mosque.location.latitude, mosque.location.longitude);
                            return mosque;
                        }).filter(mosque => mosque.distance <= MAX_DISTANCE_KM)
                          .sort((a, b) => a.distance - b.distance);

                        statusText.innerText = `Found ${nearbyMosques.length} mosques within 1 km.`;
                        currentlyDisplayed = 0;
                        document.getElementById('mosqueList').innerHTML = "";
                        
                        document.getElementById('findBtn').classList.add('hidden');
                        displayNextBatch();
                    })
                    .catch(err => {
                        statusText.innerText = "Error loading mosque data.";
                        console.error(err);
                    });
            }, () => {
                statusText.innerText = "Please allow location access to find nearby mosques.";
            });
        });

        document.getElementById('loadMoreBtn').addEventListener('click', displayNextBatch);

        function displayNextBatch() {
            const container = document.getElementById('mosqueList');
            const end = currentlyDisplayed + BATCH_SIZE;
            const batch = nearbyMosques.slice(currentlyDisplayed, end);

            batch.forEach(mosque => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${mosque.name}</h3>
                    <span class="distance">${(mosque.distance * 1000).toFixed(0)} meters away</span>
                    <div class="times">
                        <div><strong>Fajr:</strong> ${mosque.prayer_times.fajr}</div>
                        <div><strong>Dhuhr:</strong> ${mosque.prayer_times.dhuhr}</div>
                        <div><strong>Asr:</strong> ${mosque.prayer_times.asr}</div>
                        <div><strong>Maghrib:</strong> ${mosque.prayer_times.maghrib}</div>
                        <div><strong>Isha:</strong> ${mosque.prayer_times.isha}</div>
                        <div><strong>Jumu'ah:</strong> ${mosque.prayer_times.jumuah}</div>
                    </div>
                `;
                container.appendChild(card);
            });

            currentlyDisplayed += batch.length;

            if (currentlyDisplayed >= nearbyMosques.length) {
                document.getElementById('loadMoreBtn').classList.add('hidden');
            } else {
                document.getElementById('loadMoreBtn').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
