<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Mosque Radar</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; max-width: 500px; margin: 0 auto; }
        h2 { text-align: center; color: #333; }
        .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-left: 5px solid #27ae60; }
        .card h3 { margin: 0 0 8px 0; color: #2c3e50; font-size: 18px; line-height: 1.3;}
        .distance { color: #e74c3c; font-weight: bold; font-size: 16px; display: block; }
        .btn { display: block; width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
        .btn-secondary { background: #2980b9; margin-top: 10px; }
        .btn-secondary:active { background: #2471a3; }
        .btn:active { background: #219150; }
        .hidden { display: none !important; }
        #live-status { text-align: center; font-weight: bold; color: #2980b9; margin-bottom: 15px; }
    </style>
</head>
<body>

    <h2>Live Mosque Radar</h2>
    <button id="startBtn" class="btn">Start Live Radar</button>
    <p id="live-status"></p>
    
    <div id="mosqueList"></div>
    <button id="loadMoreBtn" class="btn btn-secondary hidden">Load More Mosques</button>

    <script>
        let mosquesData = []; 
        let currentSortedMosques = [];
        let watchId = null;
        let displayLimit = 5; 

        // List of backup OpenStreetMap servers
        const OVERPASS_ENDPOINTS = [
            "https://overpass-api.de/api/interpreter",
            "https://lz4.overpass-api.de/api/interpreter",
            "https://z.overpass-api.de/api/interpreter",
            "https://overpass.kumi.systems/api/interpreter"
        ];

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; 
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            const statusText = document.getElementById('live-status');
            document.getElementById('startBtn').classList.add('hidden');
            statusText.innerText = "Connecting to GPS...";

            if (!navigator.geolocation) {
                statusText.innerText = "GPS is not supported by your browser.";
                return;
            }

            navigator.geolocation.getCurrentPosition(async (position) => {
                const userLat = position.coords.latitude;
                const userLon = position.coords.longitude;
                
                const radius = 3000; 
                const query = `[out:json][timeout:15];(node["amenity"="place_of_worship"]["religion"="muslim"](around:${radius},${userLat},${userLon});way["amenity"="place_of_worship"]["religion"="muslim"](around:${radius},${userLat},${userLon}););out center;`;
                
                let dataFetched = false;

                // Try each server one by one until one works
                for (let i = 0; i < OVERPASS_ENDPOINTS.length; i++) {
                    const url = OVERPASS_ENDPOINTS[i];
                    statusText.innerText = `Scanning map server ${i + 1}...`;
                    
                    try {
                        const response = await fetch(url, {
                            method: "POST",
                            body: query
                        });

                        if (response.ok) {
                            const data = await response.json();
                            
                            mosquesData = data.elements.map(el => {
                                return {
                                    id: el.id,
                                    name: el.tags.name || "Unnamed Mosque",
                                    lat: el.lat || el.center.lat,
                                    lon: el.lon || el.center.lon
                                };
                            });

                            statusText.innerText = `Radar Active: Tracking ${mosquesData.length} mosques around you.`;
                            startLiveTracking();
                            dataFetched = true;
                            break; // Exit the loop because we successfully got the data
                        }
                    } catch (err) {
                        console.warn(`Server ${url} failed. Trying next...`);
                    }
                }

                // If all servers in the list crashed
                if (!dataFetched) {
                    statusText.innerText = "All free map servers are currently overloaded. Please try again in 5 minutes.";
                    document.getElementById('startBtn').classList.remove('hidden');
                }

            }, error => {
                const statusText = document.getElementById('live-status');
                statusText.innerText = "Please check if your phone's Location/GPS is turned on.";
                document.getElementById('startBtn').classList.remove('hidden');
            }, { 
                enableHighAccuracy: false, 
                timeout: 10000,            
                maximumAge: 60000          
            });
        });

        function startLiveTracking() {
            watchId = navigator.geolocation.watchPosition(position => {
                const currentLat = position.coords.latitude;
                const currentLon = position.coords.longitude;

                currentSortedMosques = mosquesData.map(mosque => {
                    mosque.distance = calculateDistance(currentLat, currentLon, mosque.lat, mosque.lon);
                    return mosque;
                });

                currentSortedMosques.sort((a, b) => a.distance - b.distance);
                updateUI();
                
            }, error => {
                console.error("GPS Error", error);
            }, { 
                enableHighAccuracy: true, 
                maximumAge: 0 
            });
        }

        function updateUI() {
            const container = document.getElementById('mosqueList');
            container.innerHTML = ""; 

            const visibleMosques = currentSortedMosques.slice(0, displayLimit);

            visibleMosques.forEach(mosque => {
                let distanceDisplay = (mosque.distance * 1000).toFixed(0) + " meters away";
                if(mosque.distance >= 1) {
                     distanceDisplay = mosque.distance.toFixed(2) + " km away"; 
                }

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${mosque.name}</h3>
                    <span class="distance">📍 ${distanceDisplay}</span>
                `;
                container.appendChild(card);
            });

            const loadMoreBtn = document.getElementById('loadMoreBtn');
            if (currentSortedMosques.length > displayLimit) {
                loadMoreBtn.classList.remove('hidden');
            } else {
                loadMoreBtn.classList.add('hidden');
            }
        }

        document.getElementById('loadMoreBtn').addEventListener('click', () => {
            displayLimit += 5;
            updateUI(); 
        });
    </script>
</body>
</html>
